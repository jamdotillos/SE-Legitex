<!DOCTYPE html>
<html>
    <head>
        <title>Registration</title>
        <link rel="stylesheet" href="registerstyle.css">
    </head>
    <body>
        <div class="registerForm">
    <form>
        <div class ="insideForm">
        <h1 class = "registerTitle">Registration</h1>
<div class="inputgroup">
    <label for="Username">Username:</label><br>
        <input type="text" id="username" placeholder="Enter your username" name="username"><br>
</div>
      
<div class="inputgroup">
    <label for="email">Email:</label><br>
        <input type="text" id="email" placeholder="Enter your email" name="email"><br></div>
        
<div class="inputgroup">
    <label for="age">Age:</label>
        <input type="number" id="age" placeholder="Enter your age"name="age"></div>
        
<div class="inputgroup">
    <label for="position">Position:</label>
        <input type="text" id="position" placeholder="Enter your applied position" name="position"></div>
        
<div class="inputgroup">  
    <label for="country">Country:</label><br>
        <input type="country" id="country" placeholder="Enter your country" name="country"><br></div>
      
<div class="inputgroup">
    <label for="city">City:</label><br>
        <input type="text" id="city" placeholder="Enter your city" name="city"><br></div>
        
<div class="inputgroup">   
    <label for="newPassword">New Password:</label><br>
        <input type="text" id="newPassword" placeholder="Enter your new password" name="newPassword"><br></div>
     
<div class="inputgroup"> 
    <label for="confirmPassword">Confirm Password:</label><br>
        <input type="text" id="confirmPassword" placeholder="Enter your password" name="confirmPassword"><br>
</div>
       
         <div>
         <button class="newRegisterButton">Register</button>
    </div>
     
          
    </div>
    </form>
   
    </body>
</html>
